<svg width="700" height="200" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ringMetal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A847"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#33E07A"/>
    </linearGradient>
    <radialGradient id="dotGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7CFFB2"/>
      <stop offset="40%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#00641F"/>
    </radialGradient>
    <radialGradient id="sparkGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7CFFB2"/>
      <stop offset="35%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00913F"/>
    </radialGradient>
    <linearGradient id="whiteGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </linearGradient>
    <linearGradient id="greenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6CFFAE"/>
      <stop offset="40%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>
    <filter id="ringShadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ICON: floating, no background plate -->
  <g transform="translate(10, 0)">
    <path d="M 62 152 A 70 70 0 1 1 180 88"
          fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="20" stroke-linecap="round"/>
    <path d="M 60 150 A 70 70 0 1 1 178 86"
          fill="none" stroke="url(#ringMetal)" stroke-width="18" stroke-linecap="round"
          filter="url(#ringShadow)"/>
    <path d="M 60 150 A 70 70 0 1 1 178 86"
          fill="none" stroke="#CFFFE0" stroke-width="3" stroke-linecap="round"
          opacity="0.35" stroke-dasharray="110 400"/>
    <g transform="translate(178, 86)" filter="url(#ringShadow)">
      <path d="M0 -22 L7 -7 L22 0 L7 7 L0 22 L-7 7 L-22 0 L-7 -7 Z" fill="url(#sparkGrad)"/>
      <path d="M0 -22 L3 -9 L9 -3 L-2 -2 Z" fill="#E0FFEC" opacity="0.45"/>
    </g>
    <circle cx="98" cy="138" r="16" fill="url(#dotGrad)" filter="url(#ringShadow)"/>
    <circle cx="93" cy="133" r="4" fill="#E0FFEC" opacity="0.5"/>
  </g>

  <!-- WORDMARK: white "ura" + green "nova" -->
  <g transform="translate(220, 20)">
    <text x="0" y="128"
          font-family="Arial, Helvetica, sans-serif"
          font-weight="800"
          font-size="92"
          letter-spacing="-1"
          fill="url(#whiteGlass)"
          filter="url(#textShadow)">ura</text>
    <text x="160" y="128"
          font-family="Arial, Helvetica, sans-serif"
          font-weight="800"
          font-size="92"
          letter-spacing="-1"
          fill="url(#greenGlass)"
          filter="url(#textShadow)">nova</text>
  </g>
</svg>